<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product Listing | CalcNote</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px Arial;background:#f3f5f7;color:#17191c}header{background:#0788c9;color:white;padding:18px;display:flex;gap:12px;align-items:center}header h1{font-size:23px;margin:0;flex:1}a{color:inherit}main{max-width:850px;margin:16px auto;padding:0 12px}.card{background:white;border:1px solid #d7dce1;border-radius:10px;padding:15px;margin-bottom:14px}input{padding:12px;border:1px solid #cbd2d9;border-radius:7px;font-size:16px;width:100%;min-width:0}.form{display:grid;grid-template-columns:1fr 120px auto;gap:8px}button{cursor:pointer;border:0;border-radius:7px;padding:12px 15px;font-weight:bold;font-size:15px}.primary{background:#0788c9;color:white}.secondary{background:white;border:1px solid #d7dce1}.list{display:grid;gap:8px}.item{display:grid;grid-template-columns:1fr 100px auto;gap:8px;align-items:center;padding:10px;border:1px solid #e0e5e9;border-radius:8px}.price{text-align:right;font-weight:bold;color:#067db8}.muted{font-size:13px;color:#66717c}@media(max-width:520px){.form{grid-template-columns:1fr 95px}.form button{grid-column:1/-1}.item{grid-template-columns:1fr auto}.item .del{grid-column:2;grid-row:1}.price{grid-column:1;text-align:left}}
</style></head><body>
<header><a href="calcnote.html" style="text-decoration:none;font-size:24px">←</a><h1>Product Listing</h1><a href="calcnote.html" style="text-decoration:none">Billing →</a></header>
<main><section class="card"><h2 style="margin-top:0">Add product and rate</h2><div class="form"><input id="name" placeholder="Product name, e.g. Kings"><input id="rate" type="number" min="0" step=".01" placeholder="Rate ₹"><button class="primary" id="save">Save product</button></div><p class="muted">Products are saved in this browser and appear on the billing page. Add Kings at ₹219, then enter “Kings * 5” on the bill to add five pieces at ₹219 each.</p><div id="message" class="muted"></div></section>
<section class="card"><h2 style="margin-top:0">Saved products <span id="count" class="muted"></span></h2><div id="list" class="list"></div></section></main>
<script>
const $=id=>document.getElementById(id);
function get(){try{return JSON.parse(localStorage.getItem('calcnoteProducts')||'[]')}catch(e){return []}}
function set(list){localStorage.setItem('calcnoteProducts',JSON.stringify(list))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const list=get().sort((a,b)=>a.name.localeCompare(b.name));$('count').textContent='('+list.length+')';$('list').innerHTML=list.length?list.map((p,i)=>'<div class="item"><div><b>'+esc(p.name)+'</b><div class="muted">Tap “Use in bill” to add one piece</div></div><div class="price">₹'+Number(p.rate).toLocaleString('en-IN',{maximumFractionDigits:2})+'</div><div class="del" style="display:flex;gap:5px"><button class="primary" onclick="useProduct('+i+')">Use in bill</button><button class="secondary" onclick="removeProduct('+i+')">×</button></div></div>').join(''):'<p class="muted">No products saved yet.</p>'}
function save(){const name=$('name').value.trim(),rate=Number($('rate').value);if(!name||$('rate').value===''||rate<0){$('message').textContent='Enter product name and a valid rate.';return}const list=get(),old=list.find(p=>p.name.toLowerCase()===name.toLowerCase());if(old)old.rate=rate;else list.push({name,rate});set(list);$('message').textContent=name+' saved at ₹'+rate;$('name').value='';$('rate').value='';render()}
function removeProduct(i){const list=get();list.splice(i,1);set(list);render()}
function useProduct(i){const p=get().sort((a,b)=>a.name.localeCompare(b.name))[i];sessionStorage.setItem('calcnoteAddProduct',JSON.stringify(p));location.href='calcnote.html'}
$('save').addEventListener('click',save);$('rate').addEventListener('keydown',e=>{if(e.key==='Enter')save()});$('name').addEventListener('keydown',e=>{if(e.key==='Enter')$('rate').focus()});render();
</script></body></html>
