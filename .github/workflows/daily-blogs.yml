name: RegularPost AI - Every 10 Minutes

on:
  workflow_dispatch:
  schedule:
    # Every 10 minutes
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  generate-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Generate current blog
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
        run: python scripts/generate_blog.py

      - name: Commit and publish generated blog
        run: |
          git config user.name "RegularPost Bot"
          git config user.email "actions@users.noreply.github.com"
          git add "Daily Blogs"
          if git diff --cached --quiet; then
            echo "No new blog was generated."
            exit 0
          fi
          git commit -m "Auto-generate current blog"
          git push
