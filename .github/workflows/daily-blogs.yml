name: RegularPost Hourly Schedule

on:
  workflow_dispatch:
  schedule:
    # Every hour at 30 minutes, UTC = every hour at :00 IST
    - cron: "30 * * * *"

jobs:
  hourly-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show current schedule time
        run: |
          echo "RegularPost hourly run"
          echo "UTC: $(date -u)"
          echo "IST: $(TZ=Asia/Kolkata date)"

      - name: Verify content folders
        run: |
          test -d "Daily Blogs/Movie Updates"
          test -d "Daily Blogs/News Updates"
          test -d "Daily Blogs/Google Updates"
          test -d "Daily Blogs/Tech News"
          test -d "Daily Blogs/Trending News"
          test -d "Daily Blogs/OTT Updates"
          test -d "Daily Blogs/Box Office Updates"
          echo "All RegularPost categories are ready."
