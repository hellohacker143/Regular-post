<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RegularPost — Daily Blogs</title>
<meta name="description" content="RegularPost daily blog dashboard with Movie, News, Google, Tech, Trending, OTT and Box Office updates.">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;color:#182033}
header{background:#111827;color:#fff;padding:28px 20px;text-align:center}
header h1{margin:0 0 8px;font-size:30px}header p{margin:0;color:#cbd5e1}
.container{max-width:1100px;margin:25px auto;padding:0 16px}
.search{width:100%;padding:14px 16px;border:1px solid #dbe1ea;border-radius:12px;font-size:16px;margin-bottom:22px}
.categories{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:30px}
.category{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;cursor:pointer;transition:.2s}
.category:hover,.category.active{border-color:#111827;transform:translateY(-2px)}
.category h3{margin:0 0 7px;font-size:17px}.category p{margin:0;color:#64748b;font-size:13px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:20px 0 12px}
.section-title h2{margin:0;font-size:22px}
.count{color:#64748b;font-size:14px}
.blogs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.blog{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px}
.blog .tag{display:inline-block;background:#eef2ff;padding:5px 9px;border-radius:20px;font-size:12px;margin-bottom:12px}
.blog h3{margin:0 0 9px;font-size:18px}.blog p{color:#64748b;font-size:14px;line-height:1.5;margin:0 0 12px}
.blog a{color:#2563eb;text-decoration:none;font-weight:600}
.empty{background:#fff;border:1px dashed #cbd5e1;border-radius:14px;padding:35px;text-align:center;color:#64748b}
footer{text-align:center;padding:30px;color:#64748b;font-size:13px}
</style>
</head>
<body>
<header>
<h1>RegularPost</h1>
<p>Daily Blogs & Updates</p>
</header>
<main class="container">
<input id="search" class="search" type="search" placeholder="Search blogs...">
<div id="categories" class="categories"></div>
<div class="section-title"><h2 id="title">All Blogs</h2><span id="count" class="count"></span></div>
<div id="blogs" class="blogs"><div class="empty">Loading blogs...</div></div>
</main>
<footer>RegularPost • Daily content dashboard</footer>
<script>
const owner="hellohacker143", repo="Regular-post", branch="main";
const categories=["Movie Updates","News Updates","Google Updates","Tech News","Trending News","OTT Updates","Box Office Updates"];
let allBlogs=[], selected="All Blogs";

async function getJSON(url){const r=await fetch(url);if(!r.ok)throw new Error("GitHub request failed");return r.json()}

async function load(){
  try{
    const root=await getJSON(`https://api.github.com/repos/${owner}/${repo}/contents/Daily%20Blogs?ref=${branch}`);
    renderCategories(root);
    for(const folder of root.filter(x=>x.type==="dir")){
      const items=await getJSON(folder.url+"?ref="+branch);
      for(const item of items.filter(x=>x.type==="file" && !itemIsHidden(x.name))){
        allBlogs.push({name:item.name,path:item.path,url:item.html_url,category:folder.name});
      }
    }
    render();
  }catch(e){
    document.getElementById("blogs").innerHTML='<div class="empty">Unable to load blogs right now. Make sure the repository is public and the Daily Blogs folders exist.</div>';
  }
}
function itemIsHidden(name){return name.startsWith(".")||name.endsWith(".gitkeep")}
function renderCategories(root){
  const el=document.getElementById("categories");
  el.innerHTML='<div class="category active" data-cat="All Blogs"><h3>📚 All Blogs</h3><p>View every published post</p></div>'+
  root.filter(x=>x.type==="dir").map(x=>'<div class="category" data-cat="'+escapeHTML(x.name)+'"><h3>'+icon(x.name)+' '+escapeHTML(x.name)+'</h3><p>Open category blogs</p></div>').join("");
  el.querySelectorAll(".category").forEach(c=>c.onclick=()=>{selected=c.dataset.cat;el.querySelectorAll(".category").forEach(x=>x.classList.remove("active"));c.classList.add("active");render()});
}
function render(){
 const q=document.getElementById("search").value.toLowerCase();
 let data=allBlogs.filter(x=>(selected==="All Blogs"||x.category===selected)&&(!q||x.name.toLowerCase().includes(q)||x.category.toLowerCase().includes(q)));
 document.getElementById("title").textContent=selected;
 document.getElementById("count").textContent=data.length+" blog"+(data.length===1?"":"s");
 document.getElementById("blogs").innerHTML=data.length?data.map(x=>'<article class="blog"><span class="tag">'+icon(x.category)+' '+escapeHTML(x.category)+'</span><h3>'+escapeHTML(clean(x.name))+'</h3><p>Published in RegularPost</p><a href="'+x.url+'" target="_blank" rel="noopener">Read blog →</a></article>').join(""):'<div class="empty">No blogs found in this category.</div>';
}
function clean(n){return n.replace(/\.(md|html|txt)$/i,"").replace(/[-_]/g," ")}
function escapeHTML(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function icon(c){return {"Movie Updates":"🎬","News Updates":"📰","Google Updates":"🔎","Tech News":"💻","Trending News":"🔥","OTT Updates":"📺","Box Office Updates":"💰"}[c]||"📄"}
document.getElementById("search").addEventListener("input",render);
load();
</script>
</body>
</html>
